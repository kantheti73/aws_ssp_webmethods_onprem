name: Spring Boot Build

on:
  push:
    branches: [main]
    paths:
      - 'services/ssp-springboot/**'
      - '.github/workflows/spring.yml'
  pull_request:
    paths:
      - 'services/ssp-springboot/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven build + test
        working-directory: services/ssp-springboot
        run: mvn -B -ntp clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ssp-portal-jar
          path: services/ssp-springboot/target/*.jar
          retention-days: 14
